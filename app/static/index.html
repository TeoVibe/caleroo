<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("caleroo-theme");
        if (theme === "lime" || theme === "dusk" || theme === "paper" || theme === "ink" || theme === "chalk") {
          document.documentElement.setAttribute("data-theme", theme);
        }
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d0b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="Caleroo estimates calories from a photo and keeps the daily log.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Caleroo</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2314160f'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='%23dff25c'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,560;0,9..144,640;1,9..144,560&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="gate" class="gate" hidden>
    <form id="login-form" class="sheet gate-card">
      <h2>Log in</h2>
      <label class="field">
        <span>Name</span>
        <input id="login-name" type="text" maxlength="24" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="login-password" type="password" maxlength="200" autocomplete="current-password" required>
      </label>
      <div class="action-row">
        <button type="submit" class="btn btn-primary">Log in</button>
      </div>
      <button type="button" class="advice-link gate-switch" id="show-register">New account</button>
    </form>
    <form id="register-form" class="sheet gate-card" hidden>
      <h2>New log</h2>
      <label class="field">
        <span>Name</span>
        <input id="register-name" type="text" maxlength="24" autocomplete="username" required>
      </label>
      <label class="field">
        <span>Password</span>
        <input id="register-password" type="password" minlength="6" maxlength="200" autocomplete="new-password" required>
      </label>
      <div class="field">
        <span id="avatar-label">Avatar</span>
        <div id="avatar-picker" class="avatar-picker" role="group" aria-labelledby="avatar-label"></div>
      </div>
      <label class="field">
        <span class="field-label">Diet</span>
        <input id="register-goal" type="number" min="800" max="8000" step="50" inputmode="numeric" value="2000" required>
      </label>
      <div class="macro-fields">
        <label class="field"><span>Protein g</span><input id="register-protein" type="number" min="10" max="400" step="5" inputmode="numeric" value="150" required></label>
        <label class="field"><span>Carbs g</span><input id="register-carbs" type="number" min="10" max="800" step="5" inputmode="numeric" value="200" required></label>
        <label class="field"><span>Fat g</span><input id="register-fat" type="number" min="10" max="300" step="5" inputmode="numeric" value="65" required></label>
      </div>
      <div class="action-row">
        <button type="submit" class="btn btn-primary">Create</button>
      </div>
      <button type="button" class="advice-link gate-switch" id="show-login" hidden>I have one</button>
    </form>
  </div>
  <div class="shell" id="shell">
    <div class="layout">
      <section class="panel" aria-label="Week">
        <div class="nav">
          <span class="nav-pad" id="nav-pad" aria-hidden="true"></span>
          <button type="button" id="account-btn" class="account-btn" hidden aria-label="Account"></button>
          <div class="date-nav">
            <button type="button" id="prev-day" aria-label="Previous day">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5 9 12l5.5 5.5"/></svg>
            </button>
            <button type="button" id="date-label" class="date-label" aria-haspopup="dialog" aria-controls="calendar-dialog">Today</button>
            <button type="button" id="next-day" aria-label="Next day">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.5 6.5 5.5 5.5-5.5 5.5"/></svg>
            </button>
          </div>
          <button type="button" id="open-settings" class="icon-btn" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/><path d="M19.4 13.5a7.7 7.7 0 0 0 .1-1.5 7.7 7.7 0 0 0-.1-1.5l2-1.5-2-3.4-2.4 1a7.6 7.6 0 0 0-2.6-1.5l-.4-2.6H10l-.4 2.6a7.6 7.6 0 0 0-2.6 1.5l-2.4-1-2 3.4 2 1.5a7.7 7.7 0 0 0 0 3l-2 1.5 2 3.4 2.4-1a7.6 7.6 0 0 0 2.6 1.5l.4 2.6h4.2l.4-2.6a7.6 7.6 0 0 0 2.6-1.5l2.4 1 2-3.4-2-1.5Z"/></svg>
          </button>
        </div>
        <div id="week" class="week"></div>
      </section>

      <section class="panel summary" aria-label="Goals">
        <article class="goal-card capture" id="capture">
            <div class="goal-head">
              <span class="goal-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M4 11h16c0 4.6-3.6 8-8 8s-8-3.4-8-8Z"/><path d="M8 11V7M12 11V5M16 11V7"/></svg>
              </span>
              <button type="button" class="goal-link" id="open-goal">Diet 2,000</button>
              <button type="button" class="advice-link" id="advice-btn" hidden>What to eat</button>
              <button type="button" class="advice-link" id="open-camera">Photo</button>
              <button type="button" class="advice-link" id="open-manual">Manual</button>
            </div>
            <div class="goal-main">
              <div>
                <div class="figure-row">
                  <p class="kcal-xl num" id="kcal-figure">—</p>
                  <p class="kcal-caption">kcal</p>
                </div>
                <p class="remain num" id="remain"></p>
              </div>
              <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
                <circle class="ring-track" cx="60" cy="60" r="46"></circle>
                <circle id="ring-value" class="ring-value" cx="60" cy="60" r="46"></circle>
              </svg>
            </div>
            <input id="file-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
            <div id="stage" hidden>
              <div class="viewfinder">
                <video id="video" playsinline autoplay muted hidden></video>
                <img id="preview" alt="Selected meal photo" hidden>
                <div id="analyzing" class="analyzing" hidden>
                  <span class="spinner" aria-hidden="true"></span>
                </div>
              </div>
              <div id="camera-controls" class="action-row" hidden>
                <button type="button" id="camera-cancel" class="btn btn-ghost">Cancel</button>
                <button type="button" id="shutter" class="shutter" aria-label="Take photo"></button>
                <button type="button" id="flip-camera" class="btn btn-ghost">Flip</button>
              </div>
              <div id="preview-controls" class="action-row" hidden>
                <button type="button" id="retake" class="btn btn-ghost">Back</button>
                <button type="button" id="estimate" class="btn btn-primary">Estimate</button>
              </div>
            </div>
            <div id="cap-review" hidden></div>
          </article>
          <article class="goal-card macros-card" aria-label="Macros">
            <div class="macro-stat">
              <button type="button" class="goal-link" id="open-protein-goal">Protein 150</button>
              <div class="macro-main">
                <div>
                  <div class="figure-row">
                    <p class="macro-figure num" id="protein-figure">0</p>
                    <p class="kcal-caption">g</p>
                  </div>
                  <p class="remain num" id="protein-remain"></p>
                </div>
                <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
                  <circle class="ring-track" cx="60" cy="60" r="46"></circle>
                  <circle id="ring-protein" class="ring-value" cx="60" cy="60" r="46"></circle>
                </svg>
              </div>
            </div>
            <div class="macro-stat">
              <button type="button" class="goal-link" id="open-carbs-goal">Carbs 200</button>
              <div class="macro-main">
                <div>
                  <div class="figure-row">
                    <p class="macro-figure num" id="carbs-figure">0</p>
                    <p class="kcal-caption">g</p>
                  </div>
                  <p class="remain num" id="carbs-remain"></p>
                </div>
                <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
                  <circle class="ring-track" cx="60" cy="60" r="46"></circle>
                  <circle id="ring-carbs" class="ring-value" cx="60" cy="60" r="46"></circle>
                </svg>
              </div>
            </div>
            <div class="macro-stat">
              <button type="button" class="goal-link" id="open-fat-goal">Fat 65</button>
              <div class="macro-main">
                <div>
                  <div class="figure-row">
                    <p class="macro-figure num" id="fat-figure">0</p>
                    <p class="kcal-caption">g</p>
                  </div>
                  <p class="remain num" id="fat-remain"></p>
                </div>
                <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
                  <circle class="ring-track" cx="60" cy="60" r="46"></circle>
                  <circle id="ring-fat" class="ring-value" cx="60" cy="60" r="46"></circle>
                </svg>
              </div>
            </div>
          </article>
      </section>

      <section class="panel" aria-labelledby="log-heading">
          <div class="panel-head">
            <h2 id="log-heading">Log</h2>
            <p class="kicker" id="meal-count"></p>
          </div>
          <div id="meals"></div>
      </section>
    </div>

  </div>

  <dialog id="settings-dialog">
    <form id="settings-form" class="sheet">
      <div class="panel-head">
        <h2>Settings</h2>
        <p class="kicker" id="account-label" hidden></p>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <label class="field">
        <span class="field-label"><svg class="mini-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16c0 4.6-3.6 8-8 8s-8-3.4-8-8Z"/><path d="M8 11V7M12 11V5M16 11V7"/></svg> Diet</span>
        <input id="goal-input" name="daily_goal" type="number" min="800" max="8000" step="50" inputmode="numeric" required>
      </label>
      <label class="field">
        <span class="field-label">Protein g</span>
        <input id="protein-goal-input" name="protein_goal" type="number" min="10" max="400" step="5" inputmode="numeric" required>
      </label>
      <label class="field">
        <span class="field-label">Carbs g</span>
        <input id="carbs-goal-input" name="carbs_goal" type="number" min="10" max="800" step="5" inputmode="numeric" required>
      </label>
      <label class="field">
        <span class="field-label">Fat g</span>
        <input id="fat-goal-input" name="fat_goal" type="number" min="10" max="300" step="5" inputmode="numeric" required>
      </label>
      <label class="field">
        <span id="model-label">Model</span>
        <input id="model-input" name="model" type="text" maxlength="120" spellcheck="false" autocomplete="off">
      </label>
      <div class="field">
        <span id="theme-label">Theme</span>
        <div id="theme-picker" class="theme-picker" role="group" aria-labelledby="theme-label"></div>
      </div>
      <div class="action-row">
        <button type="button" class="btn btn-ghost" id="logout-btn" hidden>Log out</button>
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="manual-dialog">
    <form id="manual-form" class="sheet">
      <div class="panel-head">
        <h2>Manual</h2>
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <label class="field">
        <span>Meal</span>
        <input id="manual-title" type="text" maxlength="80" required>
      </label>
      <label class="field">
        <span>Calories</span>
        <input id="manual-kcal" type="number" min="1" max="20000" step="1" inputmode="numeric" required>
      </label>
      <div class="macro-fields">
        <label class="field"><span>Protein g</span><input id="manual-p" type="number" min="0" max="2000" step="0.1" inputmode="decimal" value="0"></label>
        <label class="field"><span>Carbs g</span><input id="manual-c" type="number" min="0" max="2000" step="0.1" inputmode="decimal" value="0"></label>
        <label class="field"><span>Fat g</span><input id="manual-f" type="number" min="0" max="2000" step="0.1" inputmode="decimal" value="0"></label>
      </div>
      <div class="action-row">
        <button type="button" class="btn btn-ghost" data-close>Cancel</button>
        <button type="submit" class="btn btn-primary">Log</button>
      </div>
    </form>
  </dialog>

  <dialog id="calendar-dialog" aria-label="Calendar" tabindex="-1">
    <div class="sheet calendar-sheet">
      <div class="cal-sticky">
        <div class="panel-head">
          <h2 id="cal-since"></h2>
          <div class="cal-tools">
            <button type="button" class="goal-link cal-today" id="cal-today">Today</button>
            <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
          </div>
        </div>
        <div class="cal-dows" id="cal-dows"></div>
      </div>
      <div class="cal-body">
        <div id="cal-months"></div>
      </div>
    </div>
  </dialog>

  <dialog id="advice-dialog">
    <div class="sheet advice-sheet">
      <div class="panel-head">
        <button type="button" class="icon-btn" data-close aria-label="Close">×</button>
      </div>
      <div id="advice-body"></div>
      <div class="action-row">
        <button type="button" class="btn btn-primary" id="advice-again">Again</button>
      </div>
    </div>
  </dialog>

  <div id="toasts" aria-live="polite"></div>
  <noscript><p class="banner shell">Needs JavaScript.</p></noscript>
  <script src="/static/app.js"></script>
</body>
</html>
