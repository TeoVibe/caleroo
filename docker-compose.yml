name: caleroo

services:
  web:
    build: .
    image: caleroo:local
    init: true
    ports:
      - "6969:6969"
    environment:
      PORT: "6969"
      DATA_DIR: /data
      INFERENCE: ${INFERENCE:-openrouter}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-google/gemini-2.5-flash}
      LOCAL_BASE_URL: ${LOCAL_BASE_URL:-}
      LOCAL_MODEL: ${LOCAL_MODEL:-}
      LOCAL_API_KEY: ${LOCAL_API_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:6969}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/health' % os.environ.get('PORT','6969'))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
